# Velox rollback — the "roll forward to undo" lever. The in-app updater only moves
# FORWARD (higher version wins), so a bad auto-release can't be recalled; you recover
# by shipping a NEW release that restores the last-good component pins.
#
# This manually-triggered workflow reverts the component pins (kernel x2, docker x3, the two
# host CLI plugins, and the guest's qemu-user emulators)
# in versions.env to the values from a prior release tag, bumps VELOX_VERSION one MINOR
# (so it's newer than the bad release), regenerates Versions.swift, commits to main, and
# tags it — firing release.yml to build and publish the corrective release.
#
# LIMITATION: it reverts PINS only, not code. If main also carries guest/vinit/kernel-
# fragment changes since <to_version>, revert those separately. In the pure auto-maintenance
# flow main changes only via version-watch pin bumps, so a pin revert is a clean undo.
#
# Requires the AUTOMATION_SSH_KEY deploy key (so the pushed tag triggers release.yml;
# a GITHUB_TOKEN tag push would not).
name: 'Maintenance: rollback'

on:
  workflow_dispatch:
    inputs:
      to_version:
        description: 'Prior release tag whose kernel/docker pins to restore (e.g. v0.3.1 or 0.3.1)'
        required: true
      reason:
        description: 'Why (recorded in the commit message)'
        required: false
        default: 'rollback bad upstream bump'

permissions:
  contents: write

concurrency:
  group: version-watch          # share the version-watch lane so a rollback and a
  cancel-in-progress: false     # weekly bump never race on main/the tag.

jobs:
  rollback:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ssh-key: ${{ secrets.AUTOMATION_SSH_KEY }}
          fetch-depth: 0

      - name: Restore pins from ${{ inputs.to_version }} + minor-bump VELOX_VERSION
        id: revert
        env:
          TO_INPUT: ${{ inputs.to_version }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          # Normalise the tag ref (accept 0.3.1 or v0.3.1).
          TO="${TO_INPUT}"; case "$TO" in v*) : ;; *) TO="v$TO";; esac
          git rev-parse -q --verify "refs/tags/${TO}" >/dev/null \
            || { echo "::error::tag ${TO} not found"; exit 1; }

          set_var(){ tmp="$(mktemp)"; awk -v k="$1" -v v="$2" '$0 ~ "^" k "=" { if (v ~ /[ \t]/) print k "=\"" v "\""; else print k "=" v; next } {print}' versions.env > "$tmp"; mv "$tmp" versions.env; }
          # Strip one layer of surrounding double quotes. `set_var` quotes any value that
          # contains whitespace (a multi-entry deny list), and every reader here has to undo
          # that the way `source` would — otherwise the quotes are read back as part of the
          # value and re-quoted on the next append, producing `KEY=""a b" c"`. That is not
          # sourceable, so `set -a; . ./versions.env` fails (exit 127) in every consumer and
          # the deny list — the whole point of a rollback — silently empties itself.
          unquote(){ v="$1"; case "$v" in \"*\") v="${v#\"}"; v="${v%\"}";; esac; printf '%s' "$v"; }
          # cut -f2- (not awk $2): a value containing '=' would be silently truncated.
          # `|| true`: a key that is absent must yield an empty string, not kill the run.
          # Under `set -o pipefail` a non-matching grep exits 1 and propagates, which made the
          # "absent in <tag> (pre-plugin tag)" branch below unreachable — rolling back to any
          # tag older than the compose/buildx pins died with a bare shell error instead.
          get_from_tag(){ unquote "$(git show "${TO}:versions.env" | { grep -E "^$1=" || true; } | head -1 | cut -d= -f2-)"; }

          # Snapshot the versions we are rolling away from, before the restore overwrites them.
          cur_of(){ unquote "$({ grep -E "^$1=" versions.env || true; } | head -1 | cut -d= -f2-)"; }
          BAD_KERNEL="$(cur_of KERNEL_ORG_VERSION)"
          BAD_DOCKER="$(cur_of DOCKER_VERSION)"
          BAD_COMPOSE="$(cur_of DOCKER_COMPOSE_VERSION)"
          BAD_BUILDX="$(cur_of DOCKER_BUILDX_VERSION)"
          BAD_QEMU="$(cur_of QEMU_USER_VERSION)"

          for k in KERNEL_ORG_VERSION KERNEL_ORG_SHA256 DOCKER_VERSION DOCKER_STATIC_SHA256 DOCKER_CLI_MAC_ARM64_SHA256; do
            v="$(get_from_tag "$k")"
            [ -n "$v" ] || { echo "::error::could not read $k from ${TO}:versions.env"; exit 1; }
            set_var "$k" "$v"
          done

          # Host CLI plugins (compose/buildx) and the guest's qemu-user emulators were added
          # later — restore them if the target tag carried the pin, but don't fail rolling back
          # to a tag from before they existed.
          for k in DOCKER_COMPOSE_VERSION DOCKER_COMPOSE_MAC_ARM64_SHA256 DOCKER_BUILDX_VERSION DOCKER_BUILDX_MAC_ARM64_SHA256 \
                   QEMU_USER_VERSION QEMU_USER_SNAPSHOT QEMU_USER_DEB_SHA256; do
            v="$(get_from_tag "$k")"
            if [ -n "$v" ]; then set_var "$k" "$v"; else echo "::notice::$k absent in ${TO} (pre-plugin tag) — leaving current pin"; fi
          done

          # Record what we are rolling AWAY from, so the weekly scout cannot re-adopt it.
          # Restoring the pin alone lasted exactly one week: check-upstream saw the lower pin,
          # called the bad version "newer", re-validated it (compile-only — the failure was a
          # runtime one CI structurally cannot see) and re-shipped it to everyone.
          append_blocked(){  # $1 key  $2 version
            [ -n "$2" ] || return 0
            cur="$(cur_of "$1")"   # not `awk -F= $2`: that truncates at a second '=' and keeps the quotes
            case " $cur " in *" $2 "*) return 0 ;; esac   # already listed
            set_var "$1" "$(printf '%s %s' "$cur" "$2" | sed 's/^ *//')"
            echo "::notice::$1 += $2"
          }
          append_blocked KERNEL_ORG_BLOCKED "$BAD_KERNEL"
          append_blocked DOCKER_BLOCKED "$BAD_DOCKER"
          append_blocked DOCKER_COMPOSE_BLOCKED "$BAD_COMPOSE"
          append_blocked DOCKER_BUILDX_BLOCKED "$BAD_BUILDX"
          append_blocked QEMU_USER_BLOCKED "$BAD_QEMU"

          set -a; . ./versions.env; set +a
          NEW="$(printf '%s' "$VELOX_VERSION" | awk -F. '{print $1"."$2+1".0"}')"
          set_var VELOX_VERSION "$NEW"
          ./Scripts/gen-versions.sh
          echo "new_version=$NEW" >> "$GITHUB_OUTPUT"
          echo "restored_from=$TO" >> "$GITHUB_OUTPUT"
          echo "::notice::restored kernel/docker pins from ${TO}; VELOX_VERSION -> ${NEW}"

      - name: Commit + tag corrective release
        env:
          NEW:    ${{ steps.revert.outputs.new_version }}
          FROM:   ${{ steps.revert.outputs.restored_from }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          git config user.name  "velox-bot"
          git config user.email "actions@users.noreply.github.com"
          git add versions.env Sources/VeloxCore/Support/Versions.swift
          git commit -m "release: v${NEW} — rollback pins to ${FROM} (${REASON})"
          git push origin HEAD:main
          git tag "v${NEW}"
          git push origin "v${NEW}"          # deploy-key push → triggers release.yml
          echo "::notice::Tagged v${NEW}; release.yml will build and publish the corrective release."
