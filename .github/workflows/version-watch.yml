# Velox upstream-maintenance pipeline — the ONE sanctioned automatic release path
# (CLAUDE.md §9 + the "opt-in, never automatic" carve-out). Weekly, it:
#   1. detects a newer MINOR/MAJOR kernel or Docker release (Scripts/check-upstream.sh),
#   2. rewrites the pins in versions.env + regenerates Versions.swift, pushes a bump branch,
#   3. compile-validates the bump (guest kernel+rootfs build; host swift build+selftest),
#   4. on green validation, fast-forwards main to the validated commit and pushes the
#      vX.Y.Z tag that fires release.yml — which builds, Ed25519-signs, and publishes the
#      release the in-app updater serves. (No PR — the audit trail is the run + commit +
#      tag + release; GITHUB_TOKEN can't open PRs here anyway.)
#
# The CI WORKFLOW does the tag+release — never the AI agent or a human by hand
# (that stays opt-in). Note the deliberate limitation: GitHub-hosted runners cannot
# boot a Velox VM (no nested Virtualization.framework), so "green" = compiles +
# config-symbol gate + SHAs verify + host selftest. It does NOT prove the guest boots
# or that <name>.velox.local named access survives a Docker MAJOR (the nft-chain
# checklist in versions.env). Accepted risk; recover with .github/workflows/rollback.yml.
#
# Requires repo secret AUTOMATION_SSH_KEY — the PRIVATE half of a write-enabled deploy
# key (its public half is registered on the repo). ALL git writes (bump branch, the main
# fast-forward, the tag) go through it; the GITHUB_TOKEN is read-only here. Why the deploy
# key: a tag pushed with GITHUB_TOKEN does NOT trigger release.yml (GitHub's recursion
# guard), whereas a deploy-key push is treated as a normal actor and DOES. That is also
# why no PAT is needed — a deploy key is fully provisionable with `gh`. There are no PRs;
# validation runs inline as this workflow's own jobs.
name: 'Maintenance: upstream auto-update'

on:
  schedule:
    - cron: '0 7 * * 1'          # weekly, Mondays 07:00 UTC. Kernel minors land ~every
                                  # 9-10 weeks and Docker minors every few months, and we
                                  # skip patches, so nothing here is time-critical. This is
                                  # also the "max once per week" cap.
  workflow_dispatch: {}          # manual run (first cutover / testing)

permissions:
  contents: read                 # GITHUB_TOKEN is read-only (checkout + cache); every write
                                  # goes through AUTOMATION_SSH_KEY (the deploy key), not the token.

concurrency:
  group: version-watch
  cancel-in-progress: false      # let an in-flight bump finish rather than clobber the branch

env:
  BUMP_BRANCH: automation/version-bump

jobs:
  # ---------------------------------------------------------------------------
  # 1) Detect upstream bumps, rewrite pins, regenerate Versions.swift, and push the
  #    bump to a branch for the validate jobs to build. NO pull request is opened
  #    (default GITHUB_TOKEN isn't allowed to, and the PR was only an audit artifact —
  #    validation runs inline as this workflow's own jobs). `ship` fast-forwards the
  #    validated branch onto main and tags it. The run summary carries the advisory
  #    post-release checklist the PR body used to.
  # ---------------------------------------------------------------------------
  prepare:
    runs-on: ubuntu-24.04-arm
    outputs:
      changed:     ${{ steps.scout.outputs.changed }}
      new_version: ${{ steps.scout.outputs.new_version }}
      title:       ${{ steps.scout.outputs.title }}
      # The exact commit that gets validated and shipped. Everything downstream pins to
      # THIS, never to the branch name: `automation/*` is outside main's protection, and
      # resolving the branch separately in each validator and again in `ship` left a
      # 20-40 minute window in which a push to it would be fast-forwarded onto main and
      # tagged without ever having been validated.
      bump_sha:    ${{ steps.bump.outputs.bump_sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ssh-key: ${{ secrets.AUTOMATION_SSH_KEY }}   # deploy key for the branch push
          fetch-depth: 0          # need full history to base the branch off main cleanly

      # jq is preinstalled on GitHub-hosted ubuntu runners; check-upstream.sh needs it.
      - name: Scout upstream + rewrite versions.env
        id: scout
        run: ./Scripts/check-upstream.sh

      # Fail-soft is deliberate (a kernel.org outage must not block Docker CVE bumps), but it
      # must never be invisible: left alone, a rotated autosigner key is a green run every
      # Monday while the kernel pin silently stops moving.
      - name: Flag a kernel line that could not be pinned
        if: steps.scout.outputs.kernel_unpinnable == '1'
        run: |
          echo "::warning::kernel.org could not be pinned this run — the kernel stayed at its current version. If this repeats, check Scripts/keys/kernel.org-autosigner.asc against the live sha256sums.asc signer."
          echo "### ⚠️ Kernel pin skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "kernel.org was unreachable or its \`sha256sums.asc\` did not verify. Docker components were still evaluated. Repeated occurrences mean the vendored autosigner key needs attention." >> "$GITHUB_STEP_SUMMARY"

      - name: Regenerate Versions.swift + push bump branch
        id: bump          # REQUIRED: outputs.bump_sha below is read as steps.bump.outputs
        if: steps.scout.outputs.changed == 'true'
        env:
          TITLE:        ${{ steps.scout.outputs.title }}
          NEW:          ${{ steps.scout.outputs.new_version }}
          PREV:         ${{ steps.scout.outputs.prev_version }}
          KERNEL_FROM:  ${{ steps.scout.outputs.kernel_from }}
          KERNEL_TO:    ${{ steps.scout.outputs.kernel_to }}
          KERNEL_KIND:  ${{ steps.scout.outputs.kernel_kind }}
          DOCKER_FROM:  ${{ steps.scout.outputs.docker_from }}
          DOCKER_TO:    ${{ steps.scout.outputs.docker_to }}
          DOCKER_KIND:  ${{ steps.scout.outputs.docker_kind }}
        run: |
          set -euo pipefail
          ./Scripts/gen-versions.sh

          git config user.name  "velox-bot"
          git config user.email "actions@users.noreply.github.com"
          git switch -C "$BUMP_BRANCH"
          git add versions.env Sources/VeloxCore/Support/Versions.swift
          git commit -m "$TITLE"
          git push -f origin "$BUMP_BRANCH"    # non-main branch: triggers nothing; validated before it reaches main
          echo "bump_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          # --- run summary: what changed + the advisory post-release checklist ---
          {
            echo "## Automated upstream bump — \`v$NEW\` (CLAUDE.md §9)"
            echo
            echo "| Component | From | To | Kind |"
            echo "| --- | --- | --- | --- |"
            [ -n "$KERNEL_KIND" ] && echo "| Linux kernel | \`$KERNEL_FROM\` | \`$KERNEL_TO\` | $KERNEL_KIND |"
            [ -n "$DOCKER_KIND" ] && echo "| Docker engine | \`$DOCKER_FROM\` | \`$DOCKER_TO\` | $DOCKER_KIND |"
            echo "| Velox | \`$PREV\` | \`$NEW\` | minor |"
            echo
            echo "Auto-merges to main + tags \`v$NEW\` once validation is green. Green = compiles +"
            echo "config-symbol gate + SHAs verify + host selftest; CI **cannot boot the VM**, so the"
            echo "checks below are **advisory / post-release** (recover via \`rollback.yml\`)."
            echo
            echo "### Post-release verification (advisory)"
            echo "- [ ] \`docs/bench/run.sh\` on Apple Silicon vs Docker Desktop — no regression (\`docs/benchmarks.md\`)."
            [ -n "$KERNEL_KIND" ] && echo "- [ ] Kernel: guest boots with VirtioFS + Rosetta (CONFIG_ONLY gate covers symbols only)."
            [ "$DOCKER_KIND" = "major" ] && echo "- [ ] **Docker MAJOR**: re-verify \`assert_direct_access_rules()\` chains (\`filter-FORWARD\`/\`raw-PREROUTING\` in \`ip docker-bridges\`) — CI can't; named access breaks silently otherwise."
            :   # guarantee the group's last command is truthy under `set -e`
          } >> "$GITHUB_STEP_SUMMARY" || true

  # ---------------------------------------------------------------------------
  # 2a) Validate the guest builds (native arm64 Linux). Mirrors release.yml's
  #     `guest` job cache keys so unrelated re-runs are cheap and a real bump does
  #     the honest build. CONFIG_ONLY runs first as a fast fragment/symbol gate.
  # ---------------------------------------------------------------------------
  validate-guest:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        # The pinned commit, not the branch name — see prepare.outputs.bump_sha. An empty
        # value here is NOT harmless: actions/checkout treats it as unset and silently checks
        # out the default branch, so both validators would pass against the UN-BUMPED tree
        # and report a green that means nothing. Assert it first.
        with: { ref: "${{ needs.prepare.outputs.bump_sha }}" }
      - name: Assert we are on the validated commit
        run: |
          set -euo pipefail
          want="${{ needs.prepare.outputs.bump_sha }}"
          [ -n "$want" ] || { echo "::error::prepare exported no bump_sha — refusing to validate the wrong tree"; exit 1; }
          got="$(git rev-parse HEAD)"
          [ "$got" = "$want" ] || { echo "::error::checked out $got, expected $want"; exit 1; }

      - name: Compute cache keys (same recipe as release.yml)
        id: keys
        run: |
          set -a; . ./versions.env; set +a
          # Enumerate the inputs with `git ls-files` rather than by hand: the old explicit list
          # was correct only as long as nobody added a file. A new guest/kernel/* input would
          # have shipped a STALE cached kernel with no signal at all.
          KHASH=$( { echo "$KERNEL_ORG_VERSION $KERNEL_ORG_SHA256 $KERNEL_BUILDER_IMAGE $MOBY_CHECKCONFIG_REF $MOBY_CHECKCONFIG_SHA256"; \
                     git ls-files -z guest/kernel Scripts/build-kernel.sh | sort -z | xargs -0 sha256sum; \
                   } | sha256sum | cut -c1-16 )
          RHASH=$( { echo "$DOCKER_VERSION $RUST_BUILD_IMAGE $ALPINE_IMAGE"; \
                     git ls-files -z guest/rootfs guest/vinit Scripts/make-guest.sh | sort -z | xargs -0 sha256sum; \
                   } | sha256sum | cut -c1-16 )
          echo "kernel=kernel-${KERNEL_ORG_VERSION}-${KHASH}" >> "$GITHUB_OUTPUT"
          echo "rootfs=rootfs-${DOCKER_VERSION}-${RHASH}"     >> "$GITHUB_OUTPUT"

      # Fast fragment/symbol/check-config gate (~1-2 min) — catches the #1 kernel-bump
      # failure (renamed/dropped CONFIG symbols) before spending compile minutes.
      - name: Kernel config gate (CONFIG_ONLY)
        run: CONFIG_ONLY=1 ./Scripts/build-kernel.sh

      - name: Restore cached kernel
        id: kcache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: Assets/velox-vmlinux
          key: ${{ steps.keys.outputs.kernel }}
      - name: Build kernel (only when its inputs changed)
        if: steps.kcache.outputs.cache-hit != 'true'
        run: ./Scripts/build-kernel.sh

      - name: Restore cached rootfs
        id: rcache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: guest/build/root.img
          key: ${{ steps.keys.outputs.rootfs }}
      # Building the rootfs verifies DOCKER_STATIC_SHA256 (Dockerfile build-arg).
      - name: Build guest rootfs (only when its inputs changed)
        if: steps.rcache.outputs.cache-hit != 'true'
        run: ./Scripts/make-guest.sh

      # Close the gap: the mac-client SHA is otherwise only checked in build-app.sh
      # (the release `app` job) — verify it here so a bad pin fails BEFORE merge+tag.
      - name: Verify bundled mac docker-client SHA-256
        run: |
          set -a; . ./versions.env; set +a
          curl -fSL "https://download.docker.com/mac/static/stable/aarch64/docker-${DOCKER_VERSION}.tgz" -o /tmp/docker-cli.tgz
          echo "${DOCKER_CLI_MAC_ARM64_SHA256}  /tmp/docker-cli.tgz" | sha256sum -c -

      # Same gap for the host CLI plugins (compose/buildx) — otherwise only checked
      # in build-app.sh. Mind the different asset names (compose = docker-compose-
      # darwin-aarch64, buildx = buildx-v<ver>.darwin-arm64).
      - name: Verify bundled compose + buildx plugin SHA-256
        run: |
          set -a; . ./versions.env; set +a
          curl -fSL "https://github.com/docker/compose/releases/download/v${DOCKER_COMPOSE_VERSION}/docker-compose-darwin-aarch64" -o /tmp/docker-compose
          echo "${DOCKER_COMPOSE_MAC_ARM64_SHA256}  /tmp/docker-compose" | sha256sum -c -
          curl -fSL "https://github.com/docker/buildx/releases/download/v${DOCKER_BUILDX_VERSION}/buildx-v${DOCKER_BUILDX_VERSION}.darwin-arm64" -o /tmp/docker-buildx
          echo "${DOCKER_BUILDX_MAC_ARM64_SHA256}  /tmp/docker-buildx" | sha256sum -c -

  # ---------------------------------------------------------------------------
  # 2b) Validate the host builds + the selftest passes (the host half of "green").
  # ---------------------------------------------------------------------------
  validate-host:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        # The pinned commit, not the branch name — see prepare.outputs.bump_sha. An empty
        # value here is NOT harmless: actions/checkout treats it as unset and silently checks
        # out the default branch, so both validators would pass against the UN-BUMPED tree
        # and report a green that means nothing. Assert it first.
        with: { ref: "${{ needs.prepare.outputs.bump_sha }}" }
      - name: Assert we are on the validated commit
        run: |
          set -euo pipefail
          want="${{ needs.prepare.outputs.bump_sha }}"
          [ -n "$want" ] || { echo "::error::prepare exported no bump_sha — refusing to validate the wrong tree"; exit 1; }
          got="$(git rev-parse HEAD)"
          [ "$got" = "$want" ] || { echo "::error::checked out $got, expected $want"; exit 1; }
      - run: swift --version
      - name: Build (all targets)
        run: |
          ./Scripts/gen-versions.sh
          swift build
      - name: Selftest
        run: swift run velox-selftest

  # ---------------------------------------------------------------------------
  # 3) Ship: only if prepare + both validations succeeded. Fast-forward main to the
  #    validated bump commit, then tag vX.Y.Z. Both pushes use the deploy key so the
  #    tag fires release.yml (a GITHUB_TOKEN tag push would not). Nothing runs on the
  #    main push itself — there is no per-push CI; release.yml is tag-only.
  # ---------------------------------------------------------------------------
  ship:
    needs: [prepare, validate-guest, validate-host]
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ssh-key: ${{ secrets.AUTOMATION_SSH_KEY }}
          fetch-depth: 0
      - name: Fast-forward main to the validated bump + tag the release
        env:
          NEW: ${{ needs.prepare.outputs.new_version }}
          GH_TOKEN: ${{ github.token }}   # `gh release view` in the post-push confirmation below
        run: |
          set -euo pipefail
          git config user.name  "velox-bot"
          git config user.email "actions@users.noreply.github.com"
          BUMP_SHA="${{ needs.prepare.outputs.bump_sha }}"
          [ -n "$BUMP_SHA" ] || { echo "::error::prepare did not export bump_sha"; exit 1; }
          git fetch origin "$BUMP_BRANCH"
          FETCHED="$(git rev-parse FETCH_HEAD)"
          if [ "$FETCHED" != "$BUMP_SHA" ]; then
            echo "::error::$BUMP_BRANCH moved during the run ($FETCHED != validated $BUMP_SHA) — refusing to ship an unvalidated commit."
            exit 1
          fi
          # Fast-forward main to the exact commit that was validated. If main advanced
          # during the run (a human push in the ~20-min window), this is non-FF and fails
          # ON PURPOSE — we ship only what was validated, never an unvalidated rebase. The
          # run self-heals next Monday (or re-run it now); nothing partial is left behind.
          # Tag FIRST, then move main. The old order (main, then tag) was not atomic: a tag
          # push that failed afterwards left main permanently carrying the new VELOX_VERSION
          # and pins with no tag and no release — and the next weekly run reads the already-
          # bumped versions.env, sees the pins as current, exits `changed=false`, and never
          # ships it. Tagging first makes the failure mode "a tag with no main move", which
          # release.yml handles and which the next run simply repeats.
          # Idempotent: a re-run after a partial failure must not die on "tag already exists"
          # (set -e, exit 128) BEFORE it gets a chance to finish moving main.
          if git rev-parse -q --verify "refs/tags/v${NEW}" >/dev/null; then
            existing="$(git rev-list -n1 "v${NEW}")"
            [ "$existing" = "$BUMP_SHA" ] || {
              echo "::error::tag v${NEW} already exists on $existing, not on the validated $BUMP_SHA"; exit 1; }
            echo "::notice::tag v${NEW} already present on the validated commit — continuing to move main"
          else
            git tag "v${NEW}" "${BUMP_SHA}"
            git push origin "v${NEW}"                # deploy-key push → triggers release.yml
          fi
          if ! git push origin "${BUMP_SHA}:refs/heads/main"; then
            echo "::error::main advanced during the run — fast-forward rejected. v${NEW} is tagged and will build, but main was not moved; re-run version-watch to re-bump from the new main."
            exit 1
          fi
          git push origin --delete "$BUMP_BRANCH" || true
          echo "::notice::Landed v${NEW} on main and tagged it; release.yml will build and publish."
          # If the tag already existed we did NOT push it, so release.yml was never triggered
          # by this run. Confirm a release actually exists for it before calling the run green:
          # otherwise a failed release.yml on that tag disappears — main has moved, so the next
          # weekly run reads the bumped versions.env, reports `changed=false`, and the version
          # is never published to anyone. Fail loudly instead; re-running release.yml on the tag
          # is a one-click fix, silently shipping nothing is not.
          for _ in $(seq 1 10); do
            gh release view "v${NEW}" >/dev/null 2>&1 && exit 0
            sleep 30
          done
          if ! gh run list --workflow release.yml --branch "v${NEW}" --limit 1 2>/dev/null | grep -q .; then
            echo "::error::v${NEW} is tagged and main has moved, but no release and no release.yml run exist for it. Re-run release.yml on tag v${NEW} — the next weekly run will NOT retry this."
            exit 1
          fi
          echo "::notice::release.yml is running for v${NEW}."
