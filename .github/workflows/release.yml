name: 'CI & Release'

# The SINGLE CI + release workflow. There is deliberately NO per-push / per-PR CI —
# validation runs only here, at release time. On a v* tag it validates the whole build
# (guest kernel + erofs rootfs, guest PID 1 `vinit` lint, host swift build + selftest)
# and publishes a signed GitHub Release; a manual workflow_dispatch runs the same
# validation WITHOUT publishing (use it as pure CI). Automated auto-bumps additionally
# self-validate before tagging, in version-watch.yml (CLAUDE.md §9).
#
# Cut a release:
#   1. bump VELOX_VERSION in versions.env   (the single source of truth, CLAUDE.md §2)
#   2. git commit -am "release vX.Y.Z"
#   3. git tag vX.Y.Z && git push origin vX.Y.Z
# The tag MUST equal VELOX_VERSION (the verify step fails the build otherwise); the
# updater reads /releases/latest.
#
# The guest kernel + rootfs are CACHED on their own inputs: a GUI-only change rebuilds
# neither (both restored from cache); a velox.fragment change rebuilds only the kernel;
# a vinit/Dockerfile change rebuilds only the rootfs. VELOX_VERSION is deliberately NOT
# in the cache keys, so bumping it every release doesn't force a kernel recompile.
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}      # manual runs build + package but don't publish a Release

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # 1) Guest (custom kernel + erofs rootfs) on a NATIVE arm64 Linux runner —
  #    Docker is preinstalled and linux/arm64 runs without qemu. Cached per-input.
  # ---------------------------------------------------------------------------
  guest:
    runs-on: ubuntu-24.04-arm      # GitHub-hosted Linux arm64 (native — no qemu). NB: label is
                                    # `-arm`, not `-arm64`; ubuntu-26.04 has no hosted runner yet.
    steps:
      - uses: actions/checkout@v6

      - name: Verify tag matches VELOX_VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -a; . ./versions.env; set +a
          if [ "${GITHUB_REF_NAME}" != "v${VELOX_VERSION}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} != v${VELOX_VERSION} (versions.env). \
            versions.env is the single source of truth — bump VELOX_VERSION to match the tag."
            exit 1
          fi

      - name: Compute cache keys (kernel + rootfs inputs, NOT VELOX_VERSION)
        id: keys
        run: |
          set -a; . ./versions.env; set +a
          KHASH=$( { echo "$KERNEL_ORG_VERSION $KERNEL_ORG_SHA256 $KERNEL_BUILDER_IMAGE $MOBY_CHECKCONFIG_REF"; \
                     cat guest/kernel/velox.fragment guest/kernel/Dockerfile.builder Scripts/build-kernel.sh; \
                   } | sha256sum | cut -c1-16 )
          RHASH=$( { echo "$DOCKER_VERSION $RUST_BUILD_IMAGE $ALPINE_IMAGE"; \
                     cat guest/rootfs/Dockerfile guest/vinit/src/main.rs guest/vinit/Cargo.toml \
                         guest/vinit/Cargo.lock Scripts/make-guest.sh; \
                   } | sha256sum | cut -c1-16 )
          echo "kernel=kernel-${KERNEL_ORG_VERSION}-${KHASH}" >> "$GITHUB_OUTPUT"
          echo "rootfs=rootfs-${DOCKER_VERSION}-${RHASH}"     >> "$GITHUB_OUTPUT"

      - name: Restore cached kernel
        id: kcache
        uses: actions/cache@v5
        with:
          path: Assets/velox-vmlinux
          key: ${{ steps.keys.outputs.kernel }}
      - name: Build kernel (only when its inputs changed)
        if: steps.kcache.outputs.cache-hit != 'true'
        run: ./Scripts/build-kernel.sh

      - name: Restore cached rootfs
        id: rcache
        uses: actions/cache@v5
        with:
          path: guest/build/root.img
          key: ${{ steps.keys.outputs.rootfs }}
      - name: Build guest rootfs (only when its inputs changed)
        if: steps.rcache.outputs.cache-hit != 'true'
        run: ./Scripts/make-guest.sh

      - name: Upload guest artifacts
        uses: actions/upload-artifact@v7
        with:
          name: guest
          path: |
            Assets/velox-vmlinux
            guest/build/root.img
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # 1b) Lint the guest PID 1 (vinit) against its real musl target (it doesn't
  #     compile for the host). Fast; gates the release so a lint regression can't
  #     ship. This absorbed the old standalone `ci` vinit job.
  # ---------------------------------------------------------------------------
  lint-guest:
    runs-on: ubuntu-24.04-arm
    defaults:
      run: { working-directory: guest/vinit }
    steps:
      - uses: actions/checkout@v6
      - name: Install musl target
        run: rustup target add aarch64-unknown-linux-musl
      - name: Clippy (deny warnings)
        run: cargo clippy --target aarch64-unknown-linux-musl -- -D warnings
      - name: Check (release profile)
        run: cargo check --release --target aarch64-unknown-linux-musl

  # ---------------------------------------------------------------------------
  # 2) Build + package the macOS app (also runs the host selftest — the old `ci`
  #    swift job). Bundles the guest from job 1; signs ad-hoc by default (Developer
  #    ID + notarize when secrets exist). Gated on the guest build AND the lint.
  # ---------------------------------------------------------------------------
  app:
    needs: [guest, lint-guest]
    runs-on: macos-26
    # `secrets` can't be referenced in `if:` (it isn't a valid context there), so
    # surface the gating secrets as env and check those instead.
    env:
      HAS_SIGNING: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      HAS_NOTARY: ${{ secrets.AC_API_KEY_ID }}
      HAS_RELEASE_KEY: ${{ secrets.VELOX_ED25519_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v6
      - name: Fetch guest artifacts
        uses: actions/download-artifact@v8
        with: { name: guest, path: . }
      - run: swift --version && xcode-select -p && xcrun --sdk macosx --show-sdk-version

      # The dependency-free test runner (Tests/SelfTest). A red selftest blocks the release.
      - name: Selftest
        run: |
          ./Scripts/gen-versions.sh
          swift run velox-selftest

      # Developer ID signing (optional). Secrets:
      #   MACOS_CERT_P12_BASE64, MACOS_CERT_PASSWORD, MACOS_SIGN_IDENTITY
      - name: Import signing certificate
        if: ${{ env.HAS_SIGNING != '' }}
        env:
          P12: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          P12_PW: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/velox-signing.keychain-db"
          security create-keychain -p actions "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PW" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions "$KEYCHAIN" >/dev/null
          # word-splitting is intentional: pass each existing keychain path as its own arg.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

      - name: Build + package (Velox.app -> .zip)
        env:
          VELOX_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}   # empty → ad-hoc
        run: ./Scripts/build-app.sh release

      # Notarize + staple (optional). Secrets: AC_API_KEY_ID, AC_API_ISSUER_ID, AC_API_KEY_BASE64
      - name: Notarize
        if: ${{ env.HAS_NOTARY != '' }}
        env:
          KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          ISSUER: ${{ secrets.AC_API_ISSUER_ID }}
          KEY_B64: ${{ secrets.AC_API_KEY_BASE64 }}
        run: |
          echo "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/ac.p8"
          # Notarize the .zip; the app inside is stamped, so first launch verifies online.
          for f in dist/Velox-*.zip; do
            [ -f "$f" ] && xcrun notarytool submit "$f" --key "$RUNNER_TEMP/ac.p8" \
              --key-id "$KEY_ID" --issuer "$ISSUER" --wait || true
          done

      # Ed25519-sign each release .zip (what the in-app updater verifies against the
      # public key baked into the build — VELOX_RELEASE_PUBKEY in versions.env) and
      # publish SHA256SUMS (what install.sh verifies). One-time key setup:
      #   swift Scripts/release-sign.swift keygen
      # → private key to the VELOX_ED25519_PRIVATE_KEY repo secret, public key to versions.env.
      - name: Sign release artifacts (Ed25519)
        if: ${{ env.HAS_RELEASE_KEY != '' }}
        env:
          RELEASE_KEY: ${{ secrets.VELOX_ED25519_PRIVATE_KEY }}
        run: |
          for f in dist/Velox-*.zip; do
            swift Scripts/release-sign.swift sign "$f" "$RELEASE_KEY"
          done

      # Fail closed. Every client build bakes in VELOX_RELEASE_PUBKEY (versions.env) and
      # its updater REFUSES to auto-install a release whose .sig is missing or doesn't
      # verify. So if a public key is configured, each .zip MUST carry a signature that
      # verifies against it — otherwise this release would silently break auto-update for
      # the whole fleet (users fall back to a manual download). This one guard catches both
      # failure modes the `if:`-gated signing step can't: a missing signing secret (no .sig
      # produced) and a rotated/mismatched keypair (signature present but invalid).
      - name: Verify release signatures match the shipped public key
        run: |
          set -euo pipefail
          PUBKEY="$(grep -E '^VELOX_RELEASE_PUBKEY=' versions.env | head -1 | cut -d= -f2-)"
          if [ -z "$PUBKEY" ]; then
            echo "VELOX_RELEASE_PUBKEY is empty (dev build) — signature verification skipped."
            exit 0
          fi
          for f in dist/Velox-*.zip; do
            [ -f "$f" ] || continue
            if [ ! -f "$f.sig" ]; then
              echo "::error::$f is unsigned but VELOX_RELEASE_PUBKEY is set — the VELOX_ED25519_PRIVATE_KEY secret is missing. Every client would reject this update." >&2
              exit 1
            fi
            swift Scripts/release-sign.swift verify "$f" "$PUBKEY"
          done

      - name: Generate SHA256SUMS
        run: cd dist && shasum -a 256 Velox-*.zip > SHA256SUMS

      - name: Upload build artifacts (every run, for inspection)
        uses: actions/upload-artifact@v7
        with: { name: velox-app, path: dist/Velox-*, retention-days: 7 }

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')      # tags publish; manual runs don't
        uses: softprops/action-gh-release@v3
        with:
          # Velox-*.zip* also picks up the .sig files when the signing secret is set.
          files: |
            dist/Velox-*.zip*
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
