# Velox CI — every push/PR builds the host and lints the guest; nothing is released
# here (releases are the tag-triggered release.yml, and cutting one is opt-in per
# CLAUDE.md). Two jobs:
#   swift: build all host targets + run the dependency-free selftest runner.
#   vinit: type-check + clippy the guest PID 1 against its real target
#          (aarch64-unknown-linux-musl — vinit does not compile for the host).
#
# A release pushes the `release: vX.Y.Z` commit to main AND the vX.Y.Z tag. The tag
# fires release.yml, which already runs this exact build + selftest before packaging.
# So both jobs skip the release commit (the `if:` guard below) to avoid burning runner
# minutes twice on the same commit — the guard only matches a `release:`-prefixed commit
# pushed to a branch; PRs and manual runs (no head_commit) always run.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'release:') }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - run: swift --version
      - name: Build (all targets)
        run: |
          ./Scripts/gen-versions.sh
          swift build
      - name: Selftest
        run: swift run velox-selftest

  vinit:
    if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'release:') }}
    runs-on: ubuntu-24.04-arm      # native arm64 — the same label release.yml uses
    defaults:
      run: { working-directory: guest/vinit }
    steps:
      - uses: actions/checkout@v6
      - name: Install musl target
        run: rustup target add aarch64-unknown-linux-musl
      - name: Clippy (deny warnings)
        run: cargo clippy --target aarch64-unknown-linux-musl -- -D warnings
      - name: Check (release profile)
        run: cargo check --release --target aarch64-unknown-linux-musl
