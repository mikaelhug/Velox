# Compose timing fixture: three services, one dependency edge, real healthchecks.
# `compose up -d --wait` returns only when every healthcheck passes, so the metric is
# "stack actually serving", not "containers created". All images are pre-pulled untimed
# by run.sh — nothing here touches a registry on the timed path.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 1s
      timeout: 3s
      retries: 60

  app:
    image: python:3.12
    command: python -m http.server 8000
    ports:
      - "18000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000')"]
      interval: 1s
      timeout: 3s
      retries: 60

  worker:
    image: alpine:3.20
    command: sleep 3600

volumes:
  dbdata:
