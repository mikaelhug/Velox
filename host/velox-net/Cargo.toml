[package]
name = "velox-net"
version = "0.1.0"
edition = "2021"
description = "Velox host-side userspace network stack (smoltcp), linked in-process into the Swift host"

[lib]
name = "veloxnet"
crate-type = ["staticlib"]   # -> libveloxnet.a, linked into the Swift host

[dependencies]
libc = "0.2"
smoltcp = { version = "0.12", default-features = false, features = [
    "std", "medium-ethernet", "proto-ipv4",
    "socket-tcp", "socket-udp", "socket-icmp",
] }

[profile.release]
opt-level = 3        # throughput-critical hot path (unlike vinit, which is size-tuned)
lto = "thin"
codegen-units = 1
panic = "abort"      # a panic across the C ABI is UB; FFI bodies must be panic-free
strip = true
